      market:
        source: s01
        chanel: c01

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    enabled: true

mock-pay:
  enabled: false
  confirm-url: http://127.0.0.1:8080/api/v1/mock-pay/confirm
  return-url: http://127.0.0.1:8088/order-list.html
