services:
  gbm-rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: gbm-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m
    restart: unless-stopped

  gbm-rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: gbm-rocketmq-broker
    depends_on:
      - gbm-rocketmq-namesrv
    command: sh mqbroker -n gbm-rocketmq-namesrv:9876 autoCreateTopicEnable=true
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=gbm-rocketmq-namesrv:9876
      - JAVA_OPT_EXT=-Xms512m -Xmx512m
    restart: unless-stopped
