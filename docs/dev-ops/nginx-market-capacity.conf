upstream market_backend {
    least_conn;
    server host.docker.internal:8091 max_fails=3 fail_timeout=5s;
    server host.docker.internal:8092 max_fails=3 fail_timeout=5s;
    server host.docker.internal:8093 max_fails=3 fail_timeout=5s;
    keepalive 128;
}

server {
    listen 80;
    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://market_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
