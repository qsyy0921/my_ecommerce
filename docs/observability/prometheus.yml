global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/observability-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: group-buy-market
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8091

  - job_name: s-pay-mall
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8070

  - job_name: rabbitmq
    static_configs:
      - targets:
          - host.docker.internal:15692
