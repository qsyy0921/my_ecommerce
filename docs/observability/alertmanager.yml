global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-webhook
      repeat_interval: 30m

receivers:
  - name: default-webhook
    webhook_configs:
      - url: http://host.docker.internal:8070/api/v1/reconcile/alert/webhook
        send_resolved: true

  - name: critical-webhook
    webhook_configs:
      - url: http://host.docker.internal:8070/api/v1/reconcile/alert/webhook
        send_resolved: true
